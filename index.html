<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFM Gladiator Challenge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }

  /* Period tabs */
  .period-nav { display: flex; justify-content: center; gap: 8px; padding: 20px 16px 0; }
  .period-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #667; padding: 10px 24px; border-radius: 24px; cursor: pointer; font: 600 13px 'Inter', sans-serif; letter-spacing: 0.5px; transition: all 0.2s; }
  .period-btn.active { background: linear-gradient(135deg, #00c9c9, #0088cc); color: #fff; border-color: transparent; }
  .period-btn:hover:not(.active) { border-color: rgba(255,255,255,0.3); color: #aaa; }

  /* Header */
  .header { text-align: center; padding: 32px 24px 24px; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; background: radial-gradient(ellipse, rgba(0,200,200,0.15) 0%, transparent 70%); pointer-events: none; }
  .header-badge { display: inline-block; background: linear-gradient(135deg, #00c9c9, #0088cc); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 16px; border-radius: 20px; margin-bottom: 16px; }
  .header h1 { font-size: 42px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #fff 0%, #00c9c9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; padding-bottom: 6px; line-height: 1.2; }
  .header .subtitle { font-size: 22px; color: #dde; margin-top: 14px; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 0 20px rgba(0,200,200,0.3); }
  .prizes { display: flex; justify-content: center; gap: 24px; margin-top: 24px; flex-wrap: wrap; }
  .prize-chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; }
  .prize-chip.p0 { border-color: #ffd700; color: #ffd700; }
  .prize-chip.p1 { border-color: #c0c0c0; color: #c0c0c0; }
  .prize-chip.p2 { border-color: #cd7f32; color: #cd7f32; }

  /* Podium */
  .gladiator-section { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #00c9c9; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,200,200,0.3), transparent); }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 48px; }
  .podium-card { flex: 0 0 auto; width: 220px; text-align: center; }
  .podium-card.first { order: 2; }
  .podium-card.second { order: 1; }
  .podium-card.third { order: 3; }
  .podium-photo-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 12px; }
  .podium-card.first .podium-photo-wrap { width: 150px; height: 150px; }
  .podium-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: top; border: 3px solid #333; }
  .podium-card.first .podium-photo { border-color: #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
  .podium-card.second .podium-photo { border-color: #c0c0c0; box-shadow: 0 0 20px rgba(192,192,192,0.2); }
  .podium-card.third .podium-photo { border-color: #cd7f32; box-shadow: 0 0 20px rgba(205,127,50,0.2); }
  .podium-rank { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #0a0a1a; }
  .podium-card.first .podium-rank { background: #ffd700; }
  .podium-card.second .podium-rank { background: #c0c0c0; }
  .podium-card.third .podium-rank { background: #cd7f32; }
  .podium-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .podium-card.first .podium-name { font-size: 18px; }
  .podium-market { font-size: 11px; color: #667; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .podium-deals { font-size: 36px; font-weight: 900; line-height: 1; }
  .podium-card.first .podium-deals { font-size: 48px; color: #ffd700; }
  .podium-card.second .podium-deals { font-size: 36px; color: #c0c0c0; }
  .podium-card.third .podium-deals { font-size: 36px; color: #cd7f32; }
  .podium-deals-label { font-size: 11px; color: #667; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .podium-prize { margin-top: 12px; font-size: 14px; font-weight: 700; padding: 4px 14px; border-radius: 12px; display: inline-block; }
  .podium-card.first .podium-prize { background: rgba(255,215,0,0.15); color: #ffd700; }
  .podium-card.second .podium-prize { background: rgba(192,192,192,0.15); color: #c0c0c0; }
  .podium-card.third .podium-prize { background: rgba(205,127,50,0.15); color: #cd7f32; }
  .podium-base { margin-top: 16px; border-radius: 8px 8px 0 0; }
  .podium-card.first .podium-base { height: 100px; background: linear-gradient(180deg, rgba(255,215,0,0.1), rgba(255,215,0,0.02)); }
  .podium-card.second .podium-base { height: 70px; background: linear-gradient(180deg, rgba(192,192,192,0.1), rgba(192,192,192,0.02)); }
  .podium-card.third .podium-base { height: 50px; background: linear-gradient(180deg, rgba(205,127,50,0.1), rgba(205,127,50,0.02)); }

  /* Table */
  .stats-section { max-width: 1100px; margin: 0 auto 48px; padding: 0 24px; overflow-x: auto; }
  .stats-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; min-width: 860px; }
  .stats-table th { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #556; text-align: left; padding: 0 16px 8px; }
  .stats-table th:not(:first-child) { text-align: center; }
  .stats-row { background: rgba(255,255,255,0.03); border-radius: 12px; transition: background 0.2s; }
  .stats-row:hover { background: rgba(255,255,255,0.06); }
  .stats-row td { padding: 16px; vertical-align: middle; }
  .stats-row td:first-child { border-radius: 12px 0 0 12px; }
  .stats-row td:last-child { border-radius: 0 12px 12px 0; }
  .stats-row td:not(:first-child) { text-align: center; }
  .closer-info { display: flex; align-items: center; gap: 12px; }
  .closer-photo-sm { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid #333; }
  .closer-name { font-weight: 600; font-size: 15px; }
  .closer-market-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #00c9c9; background: rgba(0,200,200,0.1); padding: 2px 8px; border-radius: 4px; margin-top: 2px; display: inline-block; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 10px; color: #556; text-transform: uppercase; letter-spacing: 0.5px; }
  .cr-bar-wrap { width: 80px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 6px auto 0; overflow: hidden; }
  .cr-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #00c9c9, #0088cc); transition: width 0.6s ease; }
  .gladiator-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
  .gladiator-badge.qualified { background: linear-gradient(135deg, rgba(0,200,200,0.2), rgba(0,136,204,0.2)); color: #00c9c9; border: 1px solid rgba(0,200,200,0.3); }
  .gladiator-badge.pending { background: rgba(255,255,255,0.05); color: #556; border: 1px solid rgba(255,255,255,0.1); }

  /* Clients */
  .clients-section { max-width: 900px; margin: 0 auto 48px; padding: 0 24px; }
  .client-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .client-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .client-item img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; object-position: top; }
  .client-item .client-name { font-weight: 500; color: #ccc; flex: 1; }
  .client-item .client-date { font-size: 11px; color: #556; font-weight: 500; white-space: nowrap; }

  /* Footer */
  .footer { text-align: center; padding: 32px 24px; font-size: 12px; color: #445; line-height: 1.8; }

  /* No data */
  .no-data { text-align: center; padding: 60px 24px; color: #445; }
  .no-data .icon { font-size: 48px; margin-bottom: 16px; }
  .no-data h3 { font-size: 18px; color: #667; margin-bottom: 8px; }

  @media (max-width: 700px) {
    .header h1 { font-size: 28px; }
    .header .subtitle { font-size: 18px; }
    .podium { flex-direction: column; align-items: center; }
    .podium-card { order: unset !important; }
    .podium-card .podium-base { display: none; }
  }
</style>
</head>
<body>

<div class="period-nav" id="period-nav"></div>
<div class="header" id="header"></div>
<div id="content"><div class="no-data"><div class="icon">&#9876;</div><h3>Loading...</h3></div></div>
<div class="footer" id="footer"></div>

<script>
const SUPABASE_URL = 'https://scnezkvrcioqnjzczdjo.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjbmV6a3ZyY2lvcW5qemN6ZGpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NjAyMDQsImV4cCI6MjA5MDAzNjIwNH0.BkdJd4f54s_T76gn7gyC96aGKoe-Xfqnn59P9EbrUDw';

const PHOTOS = {
  'Magda Sitek': 'photos/magda.png',
  'Weronika Olszewska': 'photos/weronika.png',
  // Kept for historical periods only (Mar–May 2026); gone from June onward.
  'Dominic Barrett': 'photos/dominic.png',
  'Peter Haby': 'photos/peter.png',
};

let currentPeriod = null;
let allPeriods = [];

async function query(params) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries?${params}`, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
  });
  return res.json();
}

async function loadPeriods() {
  const data = await query('select=period&order=period.desc');
  return [...new Set(data.map(d => d.period))];
}

async function loadEntries(period) {
  const data = await query(`period=eq.${encodeURIComponent(period)}`);
  return data.sort((a, b) => b.deals_closed - a.deals_closed || (parseFloat(b.close_rate) || 0) - (parseFloat(a.close_rate) || 0));
}

function flag(m) { return m === 'US' ? '\u{1F1FA}\u{1F1F8} US' : '\u{1F1F5}\u{1F1F1} PL'; }

// cash_collected and AOV are stored in whole currency units (not cents).
function fmtMoney(value, currency) {
  const n = Number(value) || 0;
  if (!n) return '—';
  const cur = (currency || 'pln').toLowerCase();
  const v = Math.round(n).toLocaleString(cur === 'usd' ? 'en-US' : 'pl-PL');
  return cur === 'usd' ? `$${v}` : `${v} zł`;
}

function renderNav(periods, active) {
  document.getElementById('period-nav').innerHTML = periods.map(p =>
    `<button class="period-btn ${p === active ? 'active' : ''}" onclick="switchPeriod('${p}')">${p}</button>`
  ).join('');
}

function renderHeader(entries) {
  const e0 = entries[0];
  const minDeals = e0?.min_deals ?? 5;
  const prizes = e0?.prizes ?? ['$1,000'];
  const emojis = ['\u{1F3C6}', '\u{1F948}', '\u{1F949}'];
  const cls = ['p0', 'p1', 'p2'];
  const labels = ['1st', '2nd', '3rd'];

  document.getElementById('header').innerHTML = `
    <h1>Gladiator Challenge</h1>
    <p class="subtitle">Close ${minDeals}+ deals to enter the arena. Most deals wins.</p>
    <div class="prizes">
      ${prizes.map((p, i) => `<div class="prize-chip ${cls[i] ?? ''}">${emojis[i] ?? ''} ${labels[i]} \u2014 ${p}</div>`).join('')}
    </div>`;
}

function renderPodium(entries) {
  const gladiators = entries.filter(e => e.in_gladiator_pool);
  const prizes = entries[0]?.prizes ?? ['$1,000'];
  const minDeals = entries[0]?.min_deals ?? 5;

  if (!gladiators.length) {
    return `<div class="gladiator-section">
      <div class="section-title">Gladiator Pool</div>
      <div class="no-data"><div class="icon">&#9876;</div><h3>No gladiators yet</h3><p>Need ${minDeals}+ deals to enter the arena</p></div>
    </div>`;
  }

  const pos = ['first', 'second', 'third'];
  const cards = gladiators.slice(0, 3).map((e, i) => `
    <div class="podium-card ${pos[i]}">
      <div class="podium-photo-wrap">
        <img class="podium-photo" src="${PHOTOS[e.closer_name] ?? ''}" alt="${e.closer_name}">
        <div class="podium-rank">${i + 1}</div>
      </div>
      <div class="podium-name">${e.closer_name}</div>
      <div class="podium-market">${flag(e.market)}</div>
      <div class="podium-deals">${e.deals_closed}</div>
      <div class="podium-deals-label">deals closed</div>
      ${prizes[i] ? `<div class="podium-prize">${prizes[i]}</div>` : ''}
      <div class="podium-base"></div>
    </div>`);

  return `<div class="gladiator-section">
    <div class="section-title">Gladiator Pool</div>
    <div class="podium">${cards.join('')}</div>
  </div>`;
}

function renderTable(entries) {
  const minDeals = entries[0]?.min_deals ?? 5;
  const rows = entries.map(e => {
    const cr = parseFloat(e.close_rate) || 0;
    const cur = e.cash_currency || 'pln';
    const badge = e.in_gladiator_pool
      ? '<span class="gladiator-badge qualified">&#9876; Gladiator</span>'
      : `<span class="gladiator-badge pending">${e.deals_closed}/${minDeals}</span>`;
    return `<tr class="stats-row">
      <td><div class="closer-info">
        <img class="closer-photo-sm" src="${PHOTOS[e.closer_name] ?? ''}" alt="">
        <div><div class="closer-name">${e.closer_name}</div><span class="closer-market-tag">${flag(e.market)}</span></div>
      </div></td>
      <td><div class="stat-value">${e.calls_taken}</div><div class="stat-label">calls</div></td>
      <td><div class="stat-value">${e.close_rate}</div><div class="cr-bar-wrap"><div class="cr-bar" style="width:${Math.min(cr, 100)}%"></div></div></td>
      <td><div class="stat-value" style="color:#34d399">${fmtMoney(e.cash_collected, cur)}</div><div class="stat-label">collected</div></td>
      <td><div class="stat-value">${e.deals_closed}</div><div class="stat-label">deals</div></td>
      <td><div class="stat-value" style="color:#ffd700">${e.gold_total ?? 0}</div><div class="stat-label">AOV ${fmtMoney(e.gold_aov, cur)}</div></td>
      <td><div class="stat-value" style="color:#c0c0c0">${e.silver_total ?? 0}</div><div class="stat-label">AOV ${fmtMoney(e.silver_aov, cur)}</div></td>
      <td><div class="stat-value" style="color:#67e8f9">${fmtMoney(e.total_aov, cur)}</div><div class="stat-label">total AOV</div></td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  return `<div class="stats-section">
    <div class="section-title">Closer Metrics</div>
    <table class="stats-table"><thead><tr><th>Closer</th><th>Calls</th><th>Close Rate</th><th>Cash</th><th>Deals</th><th>Gold</th><th>Silver</th><th>Total AOV</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

function renderClients(entries) {
  const withClients = entries.filter(e => e.clients?.length > 0);
  if (!withClients.length) return '';
  const allClients = withClients.flatMap(e =>
    e.clients.map(c => ({
      closerName: e.closer_name,
      name: typeof c === 'object' ? c.name : String(c).replace(/[<>]/g, ''),
      date: typeof c === 'object' && c.date ? c.date : '',
    }))
  );
  // Sort by date descending (Mar 30 before Mar 9, etc.)
  const months = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  allClients.sort((a, b) => {
    const [am, ad] = a.date.split(' '); const [bm, bd] = b.date.split(' ');
    return (months[bm]||0)*100 + (parseInt(bd)||0) - ((months[am]||0)*100 + (parseInt(ad)||0));
  });
  const items = allClients.map(c =>
    `<div class="client-item"><img src="${PHOTOS[c.closerName] ?? ''}" alt=""><span class="client-name">${c.name}</span>${c.date ? `<span class="client-date">${c.date}</span>` : ''}</div>`
  );
  return `<div class="clients-section"><div class="section-title">Signed Clients</div><div class="client-list">${items.join('')}</div></div>`;
}

function renderFooter(entries) {
  const e0 = entries[0];
  const updated = e0?.updated_at ? new Date(e0.updated_at).toLocaleString() : '\u2014';
  const minDeals = e0?.min_deals ?? 5;
  document.getElementById('footer').innerHTML = `
    Metrics (calls, close rate, cash, Gold/Silver, AOV) pulled from the Sales Master Sheet<br>
    Minimum ${minDeals} deals to enter the Gladiator Pool<br><br>
    Last updated: ${updated}`;
}

async function switchPeriod(period) {
  currentPeriod = period;
  renderNav(allPeriods, period);
  const entries = await loadEntries(period);
  if (!entries.length) {
    document.getElementById('content').innerHTML = '<div class="no-data"><div class="icon">&#9876;</div><h3>No data for this period</h3></div>';
    return;
  }
  renderHeader(entries);
  document.getElementById('content').innerHTML = renderPodium(entries) + renderTable(entries) + renderClients(entries);
  renderFooter(entries);
}

async function init() {
  const periods = await loadPeriods();
  allPeriods = periods;
  if (!periods.length) {
    document.getElementById('content').innerHTML = '<div class="no-data"><div class="icon">&#9876;</div><h3>No data yet</h3></div>';
    return;
  }
  switchPeriod(periods[0]);
}

init();
setInterval(() => { if (currentPeriod) switchPeriod(currentPeriod); }, 5 * 60 * 1000);
</script>
</body>
</html>
